<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 物资采购需求计划管理系统</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
<div class="login-box">
  <div class="login-logo">物资采购需求计划管理系统</div>
  <div class="login-sub">Material Demand Plan Management</div>
  <form id="loginForm" class="login-form">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" autocomplete="username" placeholder="请输入用户名" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" required>
    </div>
    <div id="loginMsg" class="login-msg"></div>
    <button type="submit" class="btn btn-primary btn-block">登 录</button>
  </form>
  <div class="login-foot">基层填报 · 智能匹配 · 审批流转 · 一键导出</div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msg = document.getElementById("loginMsg");
  msg.textContent = "";
  var btn = this.querySelector("button");
  btn.disabled = true;
  try {
    var res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });
    var data = await res.json();
    if (data.ok) {
      location.href = "/app";
    } else {
      msg.textContent = data.msg || "登录失败";
    }
  } catch (err) {
    msg.textContent = "网络错误，请重试";
  }
  btn.disabled = false;
});
document.getElementById("password").addEventListener("keydown", function(e){
  if(e.key==="Enter") document.getElementById("loginForm").requestSubmit();
});
</script>
</body>
</html>
